name: GolfCaddie
options:
  bundleIdPrefix: com.moisesvargasjr
  deploymentTarget:
    iOS: "26.0"
    watchOS: "11.0"
  developmentLanguage: en
  createIntermediateGroups: true
  generateEmptyDirectories: true
packages:
  GRDB:
    url: https://github.com/groue/GRDB.swift
    from: 7.0.0
targets:
  GolfCaddie:
    type: application
    platform: iOS
    sources:
      - path: GolfCaddie
    info:
      path: GolfCaddie/Info.plist
      properties:
        CFBundleDisplayName: The Fairway Logbook
        CFBundleShortVersionString: "0.1.0"
        CFBundleVersion: "4"
        # No non-exempt encryption (standard URLSession/SQLite/system crypto only).
        # Declared here so TestFlight upload doesn't prompt for export compliance
        # on every build. https://developer.apple.com/documentation/security/complying_with_encryption_export_regulations
        ITSAppUsesNonExemptEncryption: false
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        NSLocationWhenInUseUsageDescription: "GolfCaddie tracks your shot locations during a round."
        NSLocationAlwaysAndWhenInUseUsageDescription: "GolfCaddie keeps tracking your round in the background while your phone is in your pocket."
        UIBackgroundModes:
          - location
        # Swing-detector spike: expose Documents/SpikeSessions in Files/Finder.
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
        # Companion of a HealthKit-using watch app must carry the usage strings.
        NSHealthShareUsageDescription: "The Apple Watch companion runs a workout session during swing-detection recording."
        NSHealthUpdateUsageDescription: "The Apple Watch companion runs a workout session during swing-detection recording."
        CFBundleURLTypes:
          - CFBundleURLName: com.moisesvargasjr.golfcaddie
            CFBundleURLSchemes:
              - golfcaddie
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.moisesvargasjr.golfcaddie
        TARGETED_DEVICE_FAMILY: "1"
        SWIFT_VERSION: "5.0"
        CODE_SIGN_STYLE: Automatic
        # Source of truth for device signing — was hand-added to the generated
        # pbxproj (drift); kept here so `xcodegen generate` (run whenever files
        # are added) no longer regresses on-device signing.
        DEVELOPMENT_TEAM: XH3PSRWH49
        IPHONEOS_DEPLOYMENT_TARGET: "26.0"
        GENERATE_INFOPLIST_FILE: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_ALTERNATE_APPICON_NAMES: AppIcon-Dark
    entitlements:
      path: GolfCaddie/GolfCaddie.entitlements
      properties:
        com.apple.developer.healthkit: true
    dependencies:
      - package: GRDB
        product: GRDB
      - target: GolfCaddieWatch
  GolfCaddieWatch:
    # Logging-only watch app for the swing-detector spike (single-target
    # watchOS app, embedded in GolfCaddie). Scaffolded via the Xcode wizard,
    # mirrored here — project.yml stays the source of truth.
    type: application
    platform: watchOS
    sources:
      - path: GolfCaddieWatch
    info:
      path: GolfCaddieWatch/Info.plist
      properties:
        CFBundleDisplayName: GC Spike
        CFBundleShortVersionString: "0.1.0"
        CFBundleVersion: "4"
        WKApplication: true
        WKCompanionAppBundleIdentifier: com.moisesvargasjr.golfcaddie
        WKBackgroundModes:
          - workout-processing
        NSMotionUsageDescription: "Records wrist motion at 100 Hz to develop automatic shot detection."
        NSHealthShareUsageDescription: "Runs a golf workout session so motion sensors stay active during recording."
        NSHealthUpdateUsageDescription: "Runs a golf workout session so motion sensors stay active during recording."
    entitlements:
      path: GolfCaddieWatch/GolfCaddieWatch.entitlements
      properties:
        com.apple.developer.healthkit: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.moisesvargasjr.golfcaddie.watchkitapp
        SDKROOT: watchos
        TARGETED_DEVICE_FAMILY: "4"
        SWIFT_VERSION: "5.0"
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: XH3PSRWH49
        GENERATE_INFOPLIST_FILE: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
  GolfCaddieTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: GolfCaddieTests
    dependencies:
      - target: GolfCaddie
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.moisesvargasjr.golfcaddie.tests
        TARGETED_DEVICE_FAMILY: "1"
        SWIFT_VERSION: "5.0"
        IPHONEOS_DEPLOYMENT_TARGET: "26.0"
        GENERATE_INFOPLIST_FILE: YES
        BUNDLE_LOADER: "$(TEST_HOST)"
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/GolfCaddie.app/$(BUNDLE_EXECUTABLE_FOLDER_PATH)/GolfCaddie"
schemes:
  GolfCaddieWatch:
    build:
      targets:
        GolfCaddieWatch: all
    run:
      config: Debug
  GolfCaddie:
    build:
      targets:
        GolfCaddie: all
        GolfCaddieTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - GolfCaddieTests
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
